<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%

		<style>
			#page-loader {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: opacity 0.4s ease;
				z-index: 1111;
				width: 100vw;
				height: 100vh;
				background-color: var( --color-primary );
			}

			#page-loader .trusted__svg {
				opacity: 0;
				transform: scale(0);
				animation: scaleIn .5s ease forwards 0.25s;
			}

			#page-loader .trusted__svg path {
				stroke: var( --color-primary-tint );
				animation: dash .5s ease forwards 0.25s;
			}

			

			@keyframes scaleIn {
				to {
					opacity: 1;
					transform: scale(1);
				}
			}

			@keyframes dash {
				to {
					stroke-dashoffset: 0;
					stroke: #D4EB3C;
				}
			}



			.sveltekit-ready #page-loader {
				opacity: 0;
				pointer-events: none;
				visibility: hidden;
				transition: opacity 0.4s ease, visibility 0s linear 0.4s;
			}

			#page-content {
				display: contents;
			}

			@media (prefers-reduced-motion: reduce) {
				#page-loader {
					display: none;
				}
			}
		</style>

		<noscript><style>#page-loader { display: none; }</style></noscript>
	</head>
	<body data-sveltekit-preload-data="hover">

		</div>
